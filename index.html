function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {

  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function useShakeDetector({ reversals, windowMs, minTravel, minSpeed, enabled, onShake, areaRef }) {
  const stateRef = useRef({
    lastDir: 0,
    segStart: 0,
    segStartT: 0,
    reversalsCount: 0,
    firstRevAt: 0,
    lastShakeAt: 0,
    lastX: 0,
  });

  useEffect(() => {
    if (!enabled) return;
    const area = areaRef.current;
    if (!area) return;
    const onMove = (e) => {
      const rect = area.getBoundingClientRect();
      if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) return;
      const now = performance.now();
      const x = e.clientX;
      const s = stateRef.current;
      const dx = x - s.lastX;
      s.lastX = x;
      const dir = dx === 0 ? 0 : dx > 0 ? 1 : -1;
      if (dir === 0) return;

      if (s.lastDir === 0) {
        s.lastDir = dir;
        s.segStart = x;
        s.segStartT = now;
        return;
      }

      if (dir === s.lastDir) return;

      const traveled = Math.abs(x - s.segStart);
      const elapsed = Math.max(1, now - s.segStartT);
      const speed = traveled / elapsed;
      const qualifies = traveled >= minTravel && speed >= minSpeed;

      if (qualifies) {
        if (s.reversalsCount === 0 || now - s.firstRevAt > windowMs) {
          s.reversalsCount = 1;
          s.firstRevAt = now;
        } else {
          s.reversalsCount += 1;
        }
        if (s.reversalsCount >= reversals && now - s.lastShakeAt > 1500) {
          s.lastShakeAt = now;
          s.reversalsCount = 0;
          s.firstRevAt = 0;
          onShake({ x: e.clientX, y: e.clientY });
        }
      } else {
        s.reversalsCount = 0;
        s.firstRevAt = 0;
      }

      s.lastDir = dir;
      s.segStart = x;
      s.segStartT = now;
    };
    window.addEventListener('mousemove', onMove);
    return () => window.removeEventListener('mousemove', onMove);
  }, [enabled, reversals, windowMs, minTravel, minSpeed, onShake, areaRef]);

  useEffect(() => {
    if (!enabled) return;
    const id = setInterval(() => {
      const now = performance.now();
      const s = stateRef.current;
      if (s.firstRevAt && now - s.firstRevAt > windowMs) {
        s.reversalsCount = 0;
        s.firstRevAt = 0;
      }
    }, 250);
    return () => clearInterval(id);
  }, [enabled, windowMs]);
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [scenarioIdx, setScenarioIdx] = useState(0);
  const scenario = SCENARIOS[scenarioIdx];

  const canvasAreaRef = useRef(null);

  const [entryPos, setEntryPos] = useState(null);
  const [entryRearmAt, setEntryRearmAt] = useState(0);
  const [ripple, setRipple] = useState(null);
  const [panelOpen, setPanelOpen] = useState(false);
  const [loading, setLoading] = useState(false);
  const [applied, setApplied] = useState('original');
  const [showHint, setShowHint] = useState(false);
  const [hintDismissed, setHintDismissed] = useState(false);
  const [hasShakenThisSession, setHasShakenThisSession] = useState(false);

  const [modOpen, setModOpen] = useState(false);
  const [skipSkeleton, setSkipSkeleton] = useState(false);
  const reversals = t.shakeReversals;
  const setReversals = (v) => setTweak('shakeReversals', v);

  const idleRef = useRef(Date.now());

  const shakeEnabled = true;

  const triggerEntry = useCallback((pos) => {
    setRipple({ ...pos, key: Date.now() });
    setEntryPos(pos);
    setHasShakenThisSession(true);
    setShowHint(false);
  }, []);

  useShakeDetector({
    reversals: t.shakeReversals,
    windowMs: t.shakeWindowMs,
    minTravel: t.shakeMinTravelPx,
    minSpeed: t.shakeMinSpeed,
    enabled: shakeEnabled,
    onShake: triggerEntry,
    areaRef: canvasAreaRef,
  });

  useEffect(() => {
    const onAny = () => { idleRef.current = Date.now(); };
    window.addEventListener('mousemove', onAny);
    window.addEventListener('keydown', onAny);
    window.addEventListener('click', onAny);
    return () => {
      window.removeEventListener('mousemove', onAny);
      window.removeEventListener('keydown', onAny);
      window.removeEventListener('click', onAny);
    };
  }, []);

  useEffect(() => {
    if (!t.showHintCoachmark || hasShakenThisSession || hintDismissed) return;
    const delayMs = (t.hintDelaySec || 20) * 1000;
    const id = setInterval(() => {
      if (!hasShakenThisSession && !hintDismissed && Date.now() - idleRef.current > delayMs) {
        setShowHint(true);
      }
    }, 1000);
    return () => clearInterval(id);
  }, [hasShakenThisSession, hintDismissed, t.showHintCoachmark, t.hintDelaySec]);

  useEffect(() => {
    if (!ripple) return;
    const id = setTimeout(() => setRipple(null), 800);
    return () => clearTimeout(id);
  }, [ripple]);

  const openPanel = () => {
    setEntryPos(null);
    setPanelOpen(true);
    const autoApply = (t.autoApply === 'v1' || t.autoApply === 'v2') ? t.autoApply : null;
    const delayMs = skipSkeleton ? 0 : (t.skeletonMs ?? SHAKE_CONFIG.SKELETON_MS);
    if (delayMs === 0) {
      if (autoApply) setApplied(autoApply);
    } else {
      setLoading(true);
      setTimeout(() => {
        setLoading(false);
        if (autoApply) setApplied(autoApply);
      }, delayMs);
    }
  };
  const dismissEntry = () => {
    setEntryPos(null);
    setEntryRearmAt(Date.now() + SHAKE_CONFIG.ENTRY_REARM_MS);
  };
  const closePanel = () => {
    setPanelOpen(false);
  };
  const applyVariation = (v) => setApplied(v);
  const undo = () => setApplied('original');

  const onCanvasMouseDown = (e) => {
    if (entryPos) dismissEntry();
  };

  const forceTrigger = () => {
    const rect = canvasAreaRef.current?.getBoundingClientRect();
    const x = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
    const y = rect ? rect.top + rect.height / 2 : window.innerHeight / 2;
    triggerEntry({ x, y });
    setModOpen(false);
  };
  const onReset = () => {
    setApplied('original');
    setPanelOpen(false);
    setEntryPos(null);
    setLoading(false);
    setShowHint(false);
    setHintDismissed(false);
    setHasShakenThisSession(false);
    setEntryRearmAt(0);
    idleRef.current = Date.now();
  };

  useEffect(() => { setApplied('original'); }, [scenarioIdx]);

  return (
    <div className="h-full w-full flex flex-col overflow-hidden no-select">
      <TopBar />
      <div className="flex-1 flex min-h-0">
        <LeftRail />

        <div
          ref={canvasAreaRef}
          onMouseDown={onCanvasMouseDown}
          className="flex-1 relative overflow-hidden"
          style={{ background: 'radial-gradient(at 30% 0%, #efeaf8 0%, #e8e7ee 60%, #ddd9e6 100%)' }}
        >
          <div className="absolute inset-0 flex items-center justify-center p-8">
            <div className="flex flex-col items-center gap-4">
              <div className="flex items-center gap-2 text-[11px] text-ink-500 bg-white/70 backdrop-blur px-2.5 py-1 rounded-full border border-white">
                <span className="w-1.5 h-1.5 rounded-full bg-brand-500" />
                {scenario.label} · {scenario.sublabel}
              </div>

              <CanvasFrame scenario={scenario} applied={applied} />

              {applied !== 'original' && (
                <button
                  onClick={undo}
                  className="animate-slideup mt-1 inline-flex items-center gap-2 px-3 h-9 rounded-full bg-white shadow-soft border border-ink-100 text-[12px] text-ink-800 hover:bg-ink-50"
                >
                  <Undo size={14} /> {COPY.undo}
                </button>
              )}
            </div>
          </div>

          {showHint && !hintDismissed && <ShakeHint onDismiss={() => { setShowHint(false); setHintDismissed(true); }} />}

          {ripple && <SparkleRipple key={ripple.key} x={ripple.x} y={ripple.y} />}

          {entryPos && !panelOpen && (
            <EntryPill x={entryPos.x} y={entryPos.y} label={t.entryPillCopy} accent={t.accent}
                       onOpen={openPanel} onDismiss={dismissEntry} />
          )}

          <SidePanel
            open={panelOpen}
            scenario={scenario}
            applied={applied}
            loading={loading}
            title={t.panelTitle}
            subtitle={t.panelSubtitle}
            onApply={applyVariation}
            onClose={closePanel}
          />
        </div>

        <RightPanel />
      </div>

      <button
        onClick={() => setModOpen(v => !v)}
        aria-label="Open moderator panel"
        className="fixed left-4 bottom-4 z-50 w-10 h-10 rounded-full bg-ink-900 text-white shadow-pop grid place-items-center hover:bg-ink-800"
      >
        <Gear size={18} />
      </button>

      <ModeratorPanel
        open={modOpen}
        onClose={() => setModOpen(false)}
        scenarioIdx={scenarioIdx}
        setScenarioIdx={setScenarioIdx}
        onForce={forceTrigger}
        skipSkeleton={skipSkeleton}
        setSkipSkeleton={setSkipSkeleton}
        onShowHint={() => { setShowHint(true); setHintDismissed(false); setModOpen(false); }}
        reversals={reversals}
        setReversals={setReversals}
        onReset={onReset}
      />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Beautified screen" />
        <TweakRadio
          label="After 'Try a beautified version'"
          value={t.autoApply}
          options={['v1', 'v2', 'none']}
          onChange={(v) => setTweak('autoApply', v)}
        />
        <TweakSlider
          label="Skeleton delay"
          value={t.skeletonMs} min={0} max={3000} step={100} unit="ms"
          onChange={(v) => setTweak('skeletonMs', v)}
        />
        <TweakSelect
          label="Jump to scenario"
          value={SCENARIOS[scenarioIdx].id}
          options={SCENARIOS.map(s => s.id)}
          onChange={(v) => setScenarioIdx(SCENARIOS.findIndex(s => s.id === v))}
        />
        <TweakButton label="Preview beautified now" onClick={forceTrigger} />

        <TweakSection label="Cursor shake" />
        <TweakSlider
          label="Reversals required"
          value={t.shakeReversals} min={2} max={10} step={1}
          onChange={(v) => setTweak('shakeReversals', v)}
        />
        <TweakSlider
          label="Window"
          value={t.shakeWindowMs} min={200} max={1200} step={50} unit="ms"
          onChange={(v) => setTweak('shakeWindowMs', v)}
        />
        <TweakSlider
          label="Min travel"
          value={t.shakeMinTravelPx} min={10} max={150} step={5} unit="px"
          onChange={(v) => setTweak('shakeMinTravelPx', v)}
        />
        <TweakSlider
          label="Min speed"
          value={t.shakeMinSpeed} min={0.1} max={2.5} step={0.1} unit=" px/ms"
          onChange={(v) => setTweak('shakeMinSpeed', v)}
        />

        <TweakSection label="Coachmark" />
        <TweakToggle
          label="Show 'Stuck?' hint"
          value={t.showHintCoachmark}
          onChange={(v) => setTweak('showHintCoachmark', v)}
        />
        <TweakSlider
          label="After idle"
          value={t.hintDelaySec} min={3} max={60} step={1} unit="s"
          onChange={(v) => setTweak('hintDelaySec', v)}
        />

        <TweakSection label="Copy" />
        <TweakText
          label="Entry pill"
          value={t.entryPillCopy}
          onChange={(v) => setTweak('entryPillCopy', v)}
        />
        <TweakText
          label="Panel title"
          value={t.panelTitle}
          onChange={(v) => setTweak('panelTitle', v)}
        />
        <TweakText
          label="Panel subtitle"
          value={t.panelSubtitle}
          onChange={(v) => setTweak('panelSubtitle', v)}
        />

        <TweakSection label="Reset" />
        <TweakButton label="Reset prototype state" onClick={onReset} />
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

    </script>
  </body>
</html>
